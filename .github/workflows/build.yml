name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and Package IPA with Icon
        run: |
          mkdir -p FrostLoader/Sources
          mkdir -p FrostLoader/Assets.xcassets/AppIcon.appiconset
          cp ContentView.swift FrostLoader/Sources/
          cp frostloaderApp.swift FrostLoader/Sources/
          cp AppIcon.png FrostLoader/Assets.xcassets/AppIcon.appiconset/AppIcon.png

          cat << 'EOF' > FrostLoader/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          cat << 'EOF' > FrostLoader/project.yml
          name: frostloader
          options:
            bundleIdPrefix: com.frostloader
          targets:
            frostloader:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources: [Sources]
              resources: [Assets.xcassets]
              settings:
                base:
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
          EOF

          brew install xcodegen
          cd FrostLoader
          xcodegen generate
          xcodebuild -project frostloader.xcodeproj -scheme frostloader -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CONFIGURATION_BUILD_DIR=build

          mkdir -p Payload
          cp -r build/frostloader.app Payload/
          zip -r ../frostloader.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: frostloader-unsigned-ipa
          path: frostloader.ipa
